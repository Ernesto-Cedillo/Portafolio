<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEGUNDA PAG</title>

    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/estilos.css">
    <link rel="shortcut icon" href="iconos/LOGO2.png" type="image/x-icon">
</head>

<body style="background-image: url('imagenes/Fondo.jpg'); background-size: cover; background-position: center; background-attachment: fixed;">

    <header class="navbar navbar-expand-lg bg-dark py-0 navbar-dark fixed-top">
        <nav class="container">
            <a class="navbar-brand" href="index.html#quien">
                <img src="imagenes/LOGO2.png" alt="Logo" class="d-inline-block align-text-middle logotipo">
                Pense que ya sabias
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu_principal" aria-controls="menu_principal"
                aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu_principal">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html#quien">Quién soy</a>
                    <a class="nav-link" href="index.html#gustos">Mis gustos</a>
                    <a class="nav-link" href="index.html#video">Video</a>
                    <a class="nav-link" href="index.html#random">Algo random</a>
                    <a class="nav-link" href="index.html#galeria">Galería</a>
                    <a class="nav-link active" href="more.html">More</a>
                </div>
            </div>
        </nav>
    </header>

    <section id="contacto" class="container py-5 mt-5">
        <div class="row">
            <article class="col-12 col-lg-6 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h1 class="display-5 fw-bold text-center mb-4">Manda un mensaje </h1>

                        <form id="formulario" action="#" method="get">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                    placeholder="Tu nombre" required>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="correo" name="correo"
                                    placeholder="nombre@ejemplo.com" required>
                            </div>

                            <div class="mb-3">
                                <label for="mensaje" class="form-label">Mensaje</label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="5"
                                    placeholder="Escribe tu mensaje" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-dark w-100">Enviar</button>
                        </form>
                    </div>
                </div>
            </article>

            <article class="col-12 col-lg-6 mb-4">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <h2 class="display-5 fw-bold text-center mb-4">Ubicación</h2>
                        <iframe id="mapa" class="w-100 flex-grow-1"
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3720.929014169163!2d-101.67705912494829!3d21.15522308342338!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x842bbf304cd9e7e1%3A0xca0917e5e1e92396!2sCBTIS%20225!5e0!3m2!1sen!2smx!4v1792084517684!5m2!1sen!2smx"
                            style="border:0; min-height:350px;" allowfullscreen="" loading="lazy"
                            referrerpolicy="strict-origin-when-cross-origin"></iframe>
                    </div>
                </div>
            </article>

        </div>
    </section>

    <footer class="container-fluid bg-dark text-white text-center">
        <p class="py-3 mb-0">Skarro</p>
    </footer>

    <script src="js/bootstrap.min.js"></script>
</body>

</html>
